<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HORIZON // Cellular Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-void: #030007;
            --surface-glass: rgba(18, 9, 30, 0.46);
            --surface-glass-heavy: rgba(22, 11, 38, 0.72);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-shine: rgba(216, 180, 254, 0.22);
            --accent-purple: #9333ea;
            --accent-neon: #c084fc;
            --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            
            /* Цветовая кодировка классов редкости */
            --cls-mythic: #f43f5e;
            --cls-legendary: #f59e0b;
            --cls-epic: #a855f7;
            --cls-rare: #38bdf8;
            --cls-common: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-void);
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Живой органический фон на Canvas */
        #fluidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Виньетка и глубина */
        .ambient-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, transparent 20%, rgba(3, 0, 7, 0.8) 85%);
            z-index: 1;
            pointer-events: none;
        }

        /* Мобильный каркас */
        .app-shell {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            padding: 16px 16px 105px 16px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        /* Спецификация жидкого стекла */
        .glass-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(32px) saturate(210%);
            -webkit-backdrop-filter: blur(32px) saturate(210%);
            border: 1px solid var(--border-glass);
            border-top: 1px solid var(--border-glass-shine);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* Хедер */
        header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-monogram {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(76, 29, 149, 0.55));
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: grid;
            place-items: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 4px 15px rgba(147, 51, 234, 0.3);
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 9px;
            font-weight: 600;
            color: #a855f7;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
        }

        /* Баланс */
        .balance-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 8px 14px;
            border-radius: 16px;
            text-align: right;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .balance-badge:active {
            transform: scale(0.96);
        }

        .balance-title {
            font-size: 9px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .balance-num {
            font-family: 'Space Grotesk', monospace;
            font-size: 15px;
            font-weight: 700;
            color: #34d399;
        }

        /* Вкладки */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: viewAppear 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes viewAppear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= ТЕРМИНАЛ ПРОКРУТКИ ================= */
        .roulette-console {
            padding: 22px 16px;
            text-align: center;
        }

        .console-title-wrap {
            margin-bottom: 20px;
        }

        .console-title {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .console-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 3px;
        }

        /* Окно видоискателя рулетки */
        .viewport-cylinder {
            height: 170px;
            width: 100%;
            position: relative;
            border-radius: 20px;
            background: rgba(6, 2, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95);
            overflow: hidden;
            margin-bottom: 22px;
        }

        /* Центральный визир */
        .reticle-needle {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #f43f5e, #c084fc, #f43f5e);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 16px #a855f7;
        }

        .reticle-needle::before, .reticle-needle::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
        }

        .reticle-needle::before {
            top: 0;
            border-top: 8px solid #f43f5e;
        }

        .reticle-needle::after {
            bottom: 0;
            border-bottom: 8px solid #f43f5e;
        }

        /* Лента номеров */
        .roulette-filmstrip {
            display: flex;
            position: absolute;
            left: 0;
            top: 14px;
            height: 142px;
            transform: translateX(0);
            will-change: transform;
        }

        /* Карточка eSIM */
        .sim-specimen {
            width: 175px;
            height: 140px;
            margin: 0 6px;
            flex-shrink: 0;
            border-radius: 18px;
            background: rgba(26, 12, 44, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 20px rgba(0,0,0,0.4);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .sim-specimen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 14px;
            right: 14px;
            height: 2px;
            background: var(--specimen-accent, #64748b);
            box-shadow: 0 0 12px var(--specimen-accent, #64748b);
        }

        .specimen-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .carrier-box {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .flag-shield {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            overflow: hidden;
            display: inline-flex;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .flag-shield svg {
            width: 100%;
            height: 100%;
        }

        .carrier-title {
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 0.3px;
        }

        /* Микро-чип eSIM */
        .sim-chip-svg {
            width: 22px;
            height: 18px;
            opacity: 0.7;
        }

        .phone-typography {
            font-family: 'Space Grotesk', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.4px;
            text-align: center;
            margin: 4px 0;
        }

        .specimen-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .uid-tag {
            font-family: 'Space Grotesk', monospace;
            font-size: 9px;
            color: #64748b;
        }

        .specimen-worth {
            font-family: 'Space Grotesk', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #34d399;
        }

        /* Кнопки взаимодействия */
        .terminal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-launch {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
        }

        .btn-launch:active:not(:disabled) {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-launch:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .cost-capsule {
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            color: #fbbf24;
            font-family: 'Space Grotesk', monospace;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .turbo-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .turbo-button.active {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.35);
        }

        /* ================= ХРАНИЛИЩЕ / ИНВЕНТАРЬ ================= */
        .vault-stats-bar {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vault-metric {
            font-size: 12px;
            color: #94a3b8;
        }

        .vault-metric b {
            color: #fff;
            font-family: 'Space Grotesk', monospace;
        }

        .btn-liquid-purge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: #c084fc;
            padding: 7px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-liquid-purge:active {
            background: rgba(168, 85, 247, 0.2);
        }

        .vault-registry-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vault-empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .vault-card {
            padding: 14px 16px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .vault-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--card-color, #64748b);
            box-shadow: 0 0 10px var(--card-color, #64748b);
        }

        .vault-card-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .vault-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vault-card-number {
            font-family: 'Space Grotesk', monospace;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .badge-locked {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--card-color);
            border: 1px solid var(--card-color);
        }

        .btn-sell-line {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            padding: 8px 13px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Space Grotesk', monospace;
            transition: transform 0.15s;
        }

        .btn-sell-line:active {
            transform: scale(0.95);
        }

        /* ================= НИЖНИЙ ДОК (НАВИГАЦИЯ) ================= */
        .liquid-dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 390px;
            padding: 6px;
            border-radius: 26px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            z-index: 50;
            background: rgba(16, 8, 28, 0.75);
            backdrop-filter: blur(35px) saturate(220%);
            -webkit-backdrop-filter: blur(35px) saturate(220%);
            border: 1px solid var(--border-glass-shine);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
        }

        .dock-tab {
            padding: 12px 10px;
            border-radius: 20px;
            background: transparent;
            border: none;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .dock-tab svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: transform 0.2s;
        }

        .dock-tab.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(76, 29, 149, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .dock-counter {
            background: #a855f7;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
            font-family: 'Space Grotesk', monospace;
        }

        /* ================= ВСПЛЫВАЮЩАЯ СЕССИЯ ВЫДАЧИ ================= */
        .award-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 0, 6, 0.85);
            backdrop-filter: blur(24px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .award-overlay.active {
            display: flex;
            animation: awardPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes awardPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .award-pod {
            width: 100%;
            max-width: 350px;
            padding: 30px 22px;
            border-radius: 30px;
            text-align: center;
            position: relative;
        }

        .award-chip-halo {
            width: 86px;
            height: 86px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--win-glow, #a855f7);
            box-shadow: 0 0 45px var(--win-glow, #a855f7);
            display: grid;
            place-items: center;
        }

        .award-title-num {
            font-family: 'Space Grotesk', monospace;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin: 12px 0 4px;
        }

        .award-carrier-line {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .award-serial {
            font-family: 'Space Grotesk', monospace;
            font-size: 11px;
            color: #a855f7;
            margin-bottom: 14px;
        }

        .award-valuation {
            font-family: 'Space Grotesk', monospace;
            font-size: 22px;
            font-weight: 800;
            color: #34d399;
            margin-bottom: 24px;
        }

        .award-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action-modal {
            padding: 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn-action-modal:active {
            transform: scale(0.96);
        }

        .btn-modal-keep {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border-glass);
        }

        .btn-modal-sell {
            background: linear-gradient(135deg, #10b981, #047857);
            color: #fff;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <!-- Живой Canvas фон -->
    <canvas id="fluidCanvas"></canvas>
    <div class="ambient-vignette"></div>

    <div class="app-shell">
        
        <!-- Хедер -->
        <header class="glass-panel">
            <div class="brand-cluster">
                <div class="brand-monogram">
                    <!-- Монограмма Horizon Protocol -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                        <line x1="3" y1="12" x2="21" y2="12" stroke="#c084fc" stroke-width="2"/>
                        <circle cx="12" cy="12" r="3" fill="#a855f7"/>
                    </svg>
                </div>
                <div>
                    <div class="brand-name">HORIZON</div>
                    <span class="brand-sub">CELLULAR PROTOCOL</span>
                </div>
            </div>

            <div class="balance-badge" onclick="resetLedger()" title="Нажмите для сброса">
                <div class="balance-title">Баланс</div>
                <div class="balance-num" id="uiBalance">1 000 000 ₽</div>
            </div>
        </header>

        <!-- ТЕРМИНАЛ ПРОКРУТКИ -->
        <main id="tab-terminal" class="tab-content active">
            <div class="roulette-console glass-panel">
                <div class="console-title-wrap">
                    <h2 class="console-title">Генератор частот</h2>
                    <p class="console-desc">Эксклюзивный доступ к пулам RU • UA • KZ • US • DE</p>
                </div>

                <div class="viewport-cylinder">
                    <div class="reticle-needle"></div>
                    <div class="roulette-filmstrip" id="filmstripTrack">
                        <!-- Наполняется процедурно -->
                    </div>
                </div>

                <div class="terminal-actions">
                    <button class="btn-launch" id="btnLaunchSpin" onclick="executeSpin()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                        </svg>
                        <span>КРУТИТЬ РУЛЕТКУ</span>
                        <span class="cost-capsule">1 000 ₽</span>
                    </button>

                    <button class="turbo-button" id="turboToggleBtn" onclick="toggleTurbo()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        <span>Турбо-режим: <b id="turboStatusText">ВЫКЛ</b></span>
                    </button>
                </div>
            </div>
        </main>

        <!-- ХРАНИЛИЩЕ (ИНВЕНТАРЬ) -->
        <section id="tab-vault" class="tab-content">
            <div class="glass-panel vault-stats-bar">
                <div class="vault-metric">
                    Активов: <b id="vaultTotalCount">0</b> • <b id="vaultTotalValue" style="color:#34d399;">0 ₽</b>
                </div>
                <button class="btn-liquid-purge" onclick="purgeCommonStock()">Сдать Обычные</button>
            </div>

            <div class="vault-registry-list" id="vaultRegistryBox">
                <!-- Элементы инвентаря -->
            </div>
        </section>

    </div>

    <!-- ДОК НАВИГАЦИИ -->
    <nav class="liquid-dock">
        <button class="dock-tab active" onclick="switchRoute('terminal', this)">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
            </svg>
            <span>Крутить</span>
        </button>

        <button class="dock-tab" onclick="switchRoute('vault', this)">
            <svg viewBox="0 0 24 24">
                <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            <span>Инвентарь</span>
            <span class="dock-counter" id="dockCounterLabel">0</span>
        </button>
    </nav>

    <!-- МОДАЛЬНОЕ ОКНО ВЫДАЧИ -->
    <div class="award-overlay" id="awardModal">
        <div class="award-pod glass-panel" id="awardPodFrame">
            <div class="award-chip-halo" id="awardGlowRing">
                <div class="flag-shield" id="awardFlagSvg" style="width:42px;height:42px;"></div>
            </div>
            <div class="badge-locked" id="awardRankMarker" style="display:inline-block; font-size:10px; padding:3px 8px;">КЛАСС</div>
            <div class="award-title-num" id="awardFormattedPhone">+7 (999) 000-00-00</div>
            <div class="award-carrier-line" id="awardCarrierInfo">Россия • МТС</div>
            <div class="award-serial" id="awardSerialCode">MINT #HZ-0000</div>
            <div class="award-valuation" id="awardPriceLabel">+1 000 ₽</div>

            <div class="award-buttons">
                <button class="btn-action-modal btn-modal-keep" onclick="resolveDrop(false)">В сейф</button>
                <button class="btn-action-modal btn-modal-sell" onclick="resolveDrop(true)">Продать</button>
            </div>
        </div>
    </div>

    <script>
        /* ================= ЖИВОЙ CANVAS ФОН (SMOOTH FLUID GRADIENTS) ================= */
        const canvas = document.getElementById('fluidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const blobs = [
            { x: width * 0.2, y: height * 0.2, vx: 0.4, vy: 0.3, r: 240, color: 'rgba(126, 34, 206, 0.45)' },
            { x: width * 0.8, y: height * 0.7, vx: -0.35, vy: -0.4, r: 270, color: 'rgba(76, 29, 149, 0.5)' },
            { x: width * 0.5, y: height * 0.5, vx: 0.2, vy: -0.25, r: 200, color: 'rgba(192, 38, 211, 0.25)' }
        ];

        function renderCanvas() {
            ctx.clearRect(0, 0, width, height);

            blobs.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                if (b.x - b.r < 0 || b.x + b.r > width) b.vx *= -1;
                if (b.y - b.r < 0 || b.y + b.r > height) b.vy *= -1;

                const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                grad.addColorStop(0, b.color);
                grad.addColorStop(1, 'rgba(3, 0, 7, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(renderCanvas);
        }
        renderCanvas();

        /* ================= АВТОРСКИЕ ВЕКТОРНЫЕ SVG ФЛАГИ И ЧИП ================= */
        const SVG_CHIP = `
            <svg class="sim-chip-svg" viewBox="0 0 24 20" fill="none">
                <rect x="1" y="1" width="22" height="18" rx="3" stroke="#e2e8f0" stroke-width="1.2" fill="rgba(255,255,255,0.06)"/>
                <path d="M1 7h8M1 13h8M15 7h8M15 13h8M9 1v18M15 1v18" stroke="#cbd5e1" stroke-width="1"/>
                <rect x="9" y="6" width="6" height="8" rx="1" fill="#c084fc" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
            </svg>
        `;

        const FLAGS = {
            RU: `<svg viewBox="0 0 640 480"><rect fill="#fff" width="640" height="160"/><rect fill="#0039a6" y="160" width="640" height="160"/><rect fill="#d52b1e" y="320" width="640" height="160"/></svg>`,
            UA: `<svg viewBox="0 0 640 480"><rect fill="#0057b7" width="640" height="240"/><rect fill="#ffd700" y="240" width="640" height="240"/></svg>`,
            KZ: `<svg viewBox="0 0 640 480"><rect fill="#00afca" width="640" height="480"/><circle cx="320" cy="240" r="55" fill="#fec50c"/></svg>`,
            US: `<svg viewBox="0 0 640 480"><rect fill="#bd3d44" width="640" height="480"/><path stroke="#fff" stroke-width="37" d="M0 55h640M0 129h640M0 203h640M0 277h640M0 351h640M0 425h640"/><rect fill="#192f5d" width="260" height="222"/></svg>`,
            DE: `<svg viewBox="0 0 640 480"><rect fill="#000" width="640" height="160"/><rect fill="#dd0000" y="160" width="640" height="160"/><rect fill="#ffce00" y="320" width="640" height="160"/></svg>`
        };

        const COUNTRY_POOLS = [
            { id: 'RU', name: 'Россия', code: '+7', prefixes: ['916', '985', '925', '903', '999', '950'], carriers: ['МТС', 'МегаФон', 'Билайн', 'Т-Мобайл', 'Tele2'] },
            { id: 'UA', name: 'Украина', code: '+380', prefixes: ['67', '97', '50', '66', '63', '73'], carriers: ['Kyivstar', 'Vodafone UA', 'lifecell'] },
            { id: 'KZ', name: 'Казахстан', code: '+7', prefixes: ['777', '705', '701', '775', '707'], carriers: ['Beeline KZ', 'Kcell', 'Tele2 KZ'] },
            { id: 'US', name: 'США', code: '+1', prefixes: ['212', '310', '415', '305', '702'], carriers: ['Verizon', 'AT&T', 'T-Mobile US'] },
            { id: 'DE', name: 'Германия', code: '+49', prefixes: ['151', '160', '171', '152', '176'], carriers: ['Telekom DE', 'Vodafone DE', 'O2 DE'] }
        ];

        const TIERS = {
            mythic: { name: 'МИФИЧЕСКИЙ', color: '#f43f5e', minVal: 500000, maxVal: 3000000, chance: 4 },
            legendary: { name: 'ЛЕГЕНДАРНЫЙ', color: '#f59e0b', minVal: 45000, maxVal: 250000, chance: 31 },
            epic: { name: 'ЭПИЧЕСКИЙ', color: '#a855f7', minVal: 4500, maxVal: 22000, chance: 95 },
            rare: { name: 'РЕДКИЙ', color: '#38bdf8', minVal: 1200, maxVal: 3500, chance: 250 },
            common: { name: 'ОБЫЧНЫЙ', color: '#64748b', minVal: 200, maxVal: 800, chance: 620 }
        };

        const SPIN_FEE = 1000;
        const BASE_CAPITAL = 1000000;

        /* Состояние и реестр занятых номеров */
        let state = {
            balance: parseInt(localStorage.getItem('hz_balance')) || BASE_CAPITAL,
            inventory: JSON.parse(localStorage.getItem('hz_vault')) || [],
            // Единый реестр уникальности: ни один выбитый номер не может повториться
            mintedRegistry: new Set(JSON.parse(localStorage.getItem('hz_minted_set')) || []),
            isSpinning: false,
            isTurbo: false,
            activeDrop: null
        };

        /* ================= СИНТЕЗАТОР ЗВУКА ================= */
        const audioEngine = new (window.AudioContext || window.webkitAudioContext)();
        function emitTone(freq, type = 'sine', duration = 0.04, vol = 0.03) {
            try {
                if (audioEngine.state === 'suspended') audioEngine.resume();
                const osc = audioEngine.createOscillator();
                const gain = audioEngine.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, audioEngine.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioEngine.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioEngine.destination);
                osc.start();
                osc.stop(audioEngine.currentTime + duration);
            } catch(e) {}
        }

        function playWheelTick() { emitTone(720, 'triangle', 0.02, 0.025); }
        function playFanfare(tier) {
            const pitches = tier === 'mythic' ? [523, 659, 783, 1046, 1318] :
                            tier === 'legendary' ? [440, 554, 659, 880] :
                            tier === 'epic' ? [392, 523, 659] : [349, 440];
            pitches.forEach((p, idx) => setTimeout(() => emitTone(p, 'sine', 0.24, 0.06), idx * 80));
        }

        /* ================= МАТЕМАТИЧЕСКАЯ ГЕНЕРАЦИЯ С ПРОВЕРКОЙ ЗАНЯТОСТИ ================= */
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function calculateTier() {
            const roll = randomInt(1, 1000);
            let cumulative = 0;
            for (const key of ['mythic', 'legendary', 'epic', 'rare', 'common']) {
                cumulative += TIERS[key].chance;
                if (roll <= cumulative) return key;
            }
            return 'common';
        }

        function synthesizeDigits(tierKey) {
            const lead = randomInt(1, 9).toString();
            switch (tierKey) {
                case 'mythic':
                    return [lead.repeat(7), '0000000', '1234567', '7654321'][randomInt(0, 3)];
                case 'legendary':
                    return [lead.repeat(5) + randomInt(10, 99), randomInt(10, 99) + lead.repeat(5), lead.repeat(3) + '00' + lead.repeat(2), '1230123'][randomInt(0, 3)];
                case 'epic':
                    return [lead.repeat(3) + randomInt(1000, 9999), randomInt(100, 999) + lead.repeat(4), '0000' + randomInt(100, 999), '121212' + randomInt(0, 9)][randomInt(0, 3)];
                case 'rare':
                    const p1 = randomInt(1, 9), p2 = randomInt(0, 9);
                    return [`${p1}${p1}${p2}${p2}` + randomInt(100, 999), randomInt(100, 999) + '000', '123' + randomInt(1000, 9999)][randomInt(0, 2)];
                default:
                    let raw = '';
                    for (let i = 0; i < 7; i++) raw += randomInt(0, 9);
                    return raw;
            }
        }

        function formatPhone(pool, digits7) {
            const p = pool.prefixes[randomInt(0, pool.prefixes.length - 1)];
            const d = digits7.padEnd(7, '0');
            if (pool.code === '+7' || pool.code === '+380') {
                return `${pool.code} (${p}) ${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5, 7)}`;
            }
            return `${pool.code} (${p}) ${d.slice(0, 3)}-${d.slice(3, 7)}`;
        }

        // Гарантированно уникальная выдача номера
        function mintSpecimen(isWinningTarget = false) {
            let attempts = 0;
            let candidate = null;

            while (attempts < 50) {
                attempts++;
                const tierKey = calculateTier();
                const tierObj = TIERS[tierKey];
                const pool = COUNTRY_POOLS[randomInt(0, COUNTRY_POOLS.length - 1)];
                const carrier = pool.carriers[randomInt(0, pool.carriers.length - 1)];
                const digits = synthesizeDigits(tierKey);
                const formatted = formatPhone(pool, digits);

                // Если это реальный выигрыш, проверяем, не был ли номер уже занят кем-либо
                if (isWinningTarget && state.mintedRegistry.has(formatted)) {
                    continue; // Номер занят — генерируем следующий уникальный
                }

                candidate = {
                    id: 'HZ-' + randomInt(10000, 99999),
                    tier: tierKey,
                    tierName: tierObj.name,
                    color: tierObj.color,
                    countryId: pool.id,
                    countryName: pool.name,
                    carrier: carrier,
                    number: formatted,
                    valuation: randomInt(tierObj.minVal, tierObj.maxVal)
                };
                break;
            }
            return candidate;
        }

        function buildSimHtml(item) {
            return `
                <div class="sim-specimen" style="--specimen-accent: ${item.color};">
                    <div class="specimen-header">
                        <div class="carrier-box">
                            <span class="flag-shield">${FLAGS[item.countryId]}</span>
                            <span class="carrier-title">${item.carrier}</span>
                        </div>
                        ${SVG_CHIP}
                    </div>
                    <div class="phone-typography">${item.number}</div>
                    <div class="specimen-footer">
                        <span class="uid-tag">${item.id}</span>
                        <span class="specimen-worth">${item.valuation.toLocaleString('ru-RU')} ₽</span>
                    </div>
                </div>
            `;
        }

        /* ================= МЕХАНИКА ИНЕРЦИОННОЙ РУЛЕТКИ ================= */
        const track = document.getElementById('filmstripTrack');
        const CARD_PITCH = 187; // 175px width + 12px margin
        const TARGET_SLOT = 44;

        function fillFilmstrip(winner = null) {
            track.innerHTML = '';
            for (let i = 0; i < 54; i++) {
                const item = (i === TARGET_SLOT && winner) ? winner : mintSpecimen(false);
                track.insertAdjacentHTML('beforeend', buildSimHtml(item));
            }
        }

        fillFilmstrip();

        function syncLedger() {
            document.getElementById('uiBalance').textContent = state.balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('vaultTotalCount').textContent = state.inventory.length;
            document.getElementById('dockCounterLabel').textContent = state.inventory.length;

            const total = state.inventory.reduce((acc, curr) => acc + curr.valuation, 0);
            document.getElementById('vaultTotalValue').textContent = total.toLocaleString('ru-RU') + ' ₽';

            localStorage.setItem('hz_balance', state.balance);
            localStorage.setItem('hz_vault', JSON.stringify(state.inventory));
            localStorage.setItem('hz_minted_set', JSON.stringify(Array.from(state.mintedRegistry)));
            renderVaultList();
        }

        function executeSpin() {
            if (state.isSpinning) return;
            if (state.balance < SPIN_FEE) {
                alert('Недостаточно средств на балансе!');
                return;
            }

            state.balance -= SPIN_FEE;
            state.isSpinning = true;
            document.getElementById('btnLaunchSpin').disabled = true;
            syncLedger();

            // Создаем абсолютно уникальный номер для игрока
            const targetDrop = mintSpecimen(true);
            state.activeDrop = targetDrop;
            fillFilmstrip(targetDrop);

            const viewportWidth = document.querySelector('.viewport-cylinder').offsetWidth;
            const targetCenter = (TARGET_SLOT * CARD_PITCH) + (CARD_PITCH / 2);
            const microJitter = randomInt(-38, 38);
            const destinationX = -(targetCenter - (viewportWidth / 2)) + microJitter;

            const spinDuration = state.isTurbo ? 950 : 4900;
            const startTime = performance.now();
            let lastCardIndex = 0;

            function physicsTick(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                // Плавное кубическое замедление
                const currentPos = destinationX * (1 - Math.pow(1 - progress, 3));
                const currentSlot = Math.floor(Math.abs(currentPos) / CARD_PITCH);

                if (currentSlot !== lastCardIndex && progress < 0.94) {
                    playWheelTick();
                    lastCardIndex = currentSlot;
                }

                if (progress < 1) requestAnimationFrame(physicsTick);
            }
            requestAnimationFrame(physicsTick);

            track.style.transition = state.isTurbo
                ? 'transform 0.95s cubic-bezier(0.1, 0.85, 0.25, 1)'
                : 'transform 4.9s cubic-bezier(0.06, 0.92, 0.18, 1)';
            track.style.transform = `translateX(${destinationX}px)`;

            setTimeout(() => {
                state.isSpinning = false;
                document.getElementById('btnLaunchSpin').disabled = false;
                playFanfare(targetDrop.tier);
                openAwardModal(targetDrop);
            }, spinDuration + 160);
        }

        function toggleTurbo() {
            state.isTurbo = !state.isTurbo;
            document.getElementById('turboToggleBtn').classList.toggle('active', state.isTurbo);
            document.getElementById('turboStatusText').textContent = state.isTurbo ? 'ВКЛ' : 'ВЫКЛ';
        }

        /* ================= ДИАЛОГОВОЕ ОКНО РЕЗУЛЬТАТА ================= */
        const awardModal = document.getElementById('awardModal');

        function openAwardModal(item) {
            document.getElementById('awardPodFrame').style.setProperty('--win-glow', item.color);
            document.getElementById('awardFlagSvg').innerHTML = FLAGS[item.countryId];

            const marker = document.getElementById('awardRankMarker');
            marker.textContent = item.tierName;
            marker.style.color = item.color;
            marker.style.borderColor = item.color;

            document.getElementById('awardFormattedPhone').textContent = item.number;
            document.getElementById('awardCarrierInfo').textContent = `${item.countryName} • ${item.carrier}`;
            document.getElementById('awardSerialCode').textContent = `MINT #${item.id} // ЭКСКЛЮЗИВ`;
            document.getElementById('awardPriceLabel').textContent = `+${item.valuation.toLocaleString('ru-RU')} ₽`;

            awardModal.classList.add('active');
        }

        function resolveDrop(sellNow) {
            awardModal.classList.remove('active');
            if (!state.activeDrop) return;

            // Номер навсегда закрепляется в глобальном реестре
            state.mintedRegistry.add(state.activeDrop.number);

            if (sellNow) {
                state.balance += state.activeDrop.valuation;
                emitTone(880, 'sine', 0.12, 0.08);
            } else {
                state.inventory.unshift(state.activeDrop);
            }

            state.activeDrop = null;
            syncLedger();

            setTimeout(() => {
                track.style.transition = 'none';
                track.style.transform = 'translateX(0px)';
                fillFilmstrip();
            }, 300);
        }

        /* ================= ХРАНИЛИЩЕ ================= */
        function renderVaultList() {
            const container = document.getElementById('vaultRegistryBox');
            if (state.inventory.length === 0) {
                container.innerHTML = '<div class="vault-empty-state">Ваше персональное хранилище пусто.<br>Крутите рулетку для получения эксклюзивных номеров.</div>';
                return;
            }

            container.innerHTML = state.inventory.map(item => `
                <div class="vault-card glass-panel" style="--card-color: ${item.color};">
                    <div class="vault-card-left">
                        <div class="vault-card-meta">
                            <span class="flag-shield" style="width:14px;height:14px;">${FLAGS[item.countryId]}</span>
                            <span style="font-size:11px;color:#cbd5e1;font-weight:600;">${item.carrier}</span>
                            <span class="badge-locked" style="font-size:7px;padding:2px 4px;">${item.tierName}</span>
                        </div>
                        <div class="vault-card-number">${item.number}</div>
                    </div>
                    <button class="btn-sell-line" onclick="sellVaultItem('${item.id}')">
                        <span>Сдать</span>
                        <b>${item.valuation.toLocaleString('ru-RU')} ₽</b>
                    </button>
                </div>
            `).join('');
        }

        function sellVaultItem(id) {
            const idx = state.inventory.findIndex(x => x.id === id);
            if (idx !== -1) {
                const item = state.inventory[idx];
                state.balance += item.valuation;
                state.inventory.splice(idx, 1);
                emitTone(720, 'sine', 0.08, 0.05);
                syncLedger();
            }
        }

        function purgeCommonStock() {
            const commons = state.inventory.filter(x => x.tier === 'common');
            if (commons.length === 0) {
                alert('В хранилище нет номеров обычного класса');
                return;
            }
            const revenue = commons.reduce((sum, item) => sum + item.valuation, 0);
            state.balance += revenue;
            state.inventory = state.inventory.filter(x => x.tier !== 'common');
            emitTone(780, 'sine', 0.14, 0.07);
            syncLedger();
        }

        function resetLedger() {
            if (confirm('Восстановить стартовый капитал 1 000 000 ₽?')) {
                state.balance = BASE_CAPITAL;
                syncLedger();
            }
        }

        /* ================= НАВИГАЦИЯ ================= */
        function switchRoute(routeName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dock-tab').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${routeName}`).classList.add('active');
            btnElement.classList.add('active');
            emitTone(440, 'triangle', 0.02, 0.02);
        }

        // Первичный запуск
        syncLedger();
    </script>
</body>
